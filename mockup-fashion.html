<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maple Fashion — Classic</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e; --acc:#58a6ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--txt); font:14px/1.4 system-ui,sans-serif; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  #stage { padding:8px 12px 6px; display:flex; align-items:center; gap:10px; background:var(--bg); }
  #canvas { background:repeating-conic-gradient(#161b22 0 25%, #0d1117 0 50%) 0 0/18px 18px; border:1px solid var(--line); border-radius:12px; padding:4px; flex:none; }
  #preview { width:132px; height:132px; object-fit:contain; image-rendering:pixelated; }
  #side { display:flex; flex-direction:column; gap:6px; flex:1; min-width:0; }
  #controls { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #controls select, #controls button { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px 10px; font-size:14px; }
  #controls button { cursor:pointer; min-height:40px; }
  #skins { display:flex; gap:8px; align-items:center; }
  #skins button { width:32px; height:32px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0; }
  #skins button.on { border-color:var(--acc); }
  #worn { color:var(--dim); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sheet { flex:1; display:flex; flex-direction:column; background:var(--panel); border-radius:16px 16px 0 0; margin-top:-10px; overflow:hidden; border-top:1px solid var(--line); }
  #grab { width:44px; height:4px; border-radius:2px; background:var(--line); margin:8px auto 2px; flex:none; }
  #bar { display:flex; gap:8px; padding:0 10px; flex:none; align-items:center; }
  #bar input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:10px; font-size:16px; min-width:0; }
  #bar label { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:4px; white-space:nowrap; }
  #sexbtn { background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:10px; font-size:13px; white-space:nowrap; cursor:pointer; }
  #menu { position:absolute; right:10px; top:0; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:6px; display:none; z-index:10; box-shadow:0 8px 24px #000a; }
  #menu button { display:block; width:100%; background:none; border:none; color:var(--txt); padding:10px 14px; font-size:14px; text-align:left; cursor:pointer; border-radius:6px; }
  #menu button.on { background:#1c2b3f; }
  #wrap { position:relative; flex:none; }
  #scroll { overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; padding-bottom:32px; }
  .sec { padding:10px 10px 0; }
  .sec h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:2px 2px 8px; font-weight:600; }
  .row { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  .tile { flex:none; width:76px; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 4px; cursor:pointer; text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tile.on { border-color:var(--acc); background:#1c2b3f; }
  .tile img { width:40px; height:40px; object-fit:contain; image-rendering:pixelated; }
  .tile span { font-size:10px; color:var(--dim); line-height:1.25; }
  .tile.on span { color:var(--txt); }
  .dot { width:26px; height:26px; border-radius:50%; border:2px solid var(--line); }
  .tile.on .dot { border-color:var(--acc); }
  .sec h2 { display:flex; align-items:center; justify-content:space-between; }
  .seeall { background:none; border:none; color:var(--acc); font-size:12px; cursor:pointer; padding:4px 2px; }
  #catpage { display:none; flex:1; flex-direction:column; overflow:hidden; min-height:0; }
  #catpage.open { display:flex; }
  #scroll.hidden { display:none; }
  #cathead { display:flex; align-items:center; gap:8px; padding:8px 10px; flex:none; }
  #back { background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:10px 12px; font-size:14px; cursor:pointer; }
  #cattitle { font-weight:600; font-size:15px; flex:1; }
  #catbar { display:flex; gap:8px; padding:0 10px 8px; flex:none; }
  #catbar input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:10px; font-size:16px; min-width:0; }
  #catbar label { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:4px; white-space:nowrap; }
  #catgrid { overflow-y:auto; flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:0 10px 32px; align-content:start; -webkit-overflow-scrolling:touch; }
  /* gender gate */
  #gate { position:fixed; inset:0; background:#0d1117f2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:50; padding:24px; }
  #gate h1 { font-size:20px; margin:0; }
  #gate p { color:var(--dim); margin:0 0 6px; font-size:13px; }
  #gate button { width:min(300px,80vw); padding:14px; font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--txt); cursor:pointer; }
  #gate button:active { border-color:var(--acc); background:#1c2b3f; }
  @media (min-width:900px) {
    body { flex-direction:row; }
    #stage { width:440px; flex:none; height:100dvh; justify-content:center; }
    #sheet { margin-top:0; border-radius:0; height:100dvh; }
  }
</style>
</head>

const HAIR_COLORS=['Black','Red','Orange','Blonde','Green','Blue','Purple','Brown'];
const HAIR_DOTS=['#23232a','#a83a32','#d97b2e','#e3c46a','#4a8f4d','#4a6fa5','#7a4a8f','#6e4a2f'];
let skins=[2000];
let sel={sex:null,skin:2000,hair:30000,hairCol:0,face:20000,anim:'stand1',frame:0,items:{}};
try{ const h=JSON.parse(atob(location.hash.slice(1))); if(h&&typeof h==='object') sel={...sel,...h}; }catch(e){}
const $=id=>document.getElementById(id);
const scroll=$('scroll'), prev=$('preview'), status=$('status'), worn=$('worn');
function vis(o){ return o.sex==='u'||o.sex===sel.sex; }
function slotOf(o){
  if(o.sub==='Hair'||o.sub==='Face') return o.sub;
  if(WEAPONS.has(o.sub)) return 'Weapon';
  if(o.sub==='Face Accessory') return 'FaceAcc';
  if(o.sub==='Eye Decoration') return 'EyeDec';
  if(o.sub==='Earrings'||o.sub==='Ring') return 'Earring';
  return o.sub; // Hat Top Bottom Overall Shoes Glove Cape Shield
}
const SECTIONS=[
  {id:'Hair',label:'Hair'},
  {id:'Color',label:'Hair Color'},
  {id:'Face',label:'Face'},
  {id:'Hat',label:'Hat'},{id:'Top',label:'Top'},{id:'Bottom',label:'Bottom'},{id:'Overall',label:'Overall'},
  {id:'Shoes',label:'Shoes'},{id:'Glove',label:'Gloves'},{id:'Cape',label:'Cape'},{id:'Shield',label:'Shield'},
  {id:'FaceAcc',label:'Face Accessory'},{id:'EyeDec',label:'Eye'},{id:'Earring',label:'Earrings'},
  {id:'Weapon',label:'Weapon'},
];
function baseName(n){ for(const c of HAIR_COLORS){ if(n.startsWith(c+' ')) return n.slice(c.length+1); } return n; }
function hairStyles(){
  const seen={};
  for(const h of CAT){ if(h.sub!=='Hair'||!vis(h)) continue; const st=Math.floor(h.id/10); (seen[st]=seen[st]||[]).push(h); }
  return Object.keys(seen).sort((a,b)=>a-b).map(st=>({style:+st,items:seen[st],name:baseName(seen[st][0].name),icon:seen[st][0].id}));
}
function itemsFor(sec){
  let r=CAT.filter(o=>vis(o)&&slotOf(o)===sec);
  if($('cash').checked) r=r.filter(o=>o.cash);
  const q=$('q').value.trim().toLowerCase();
  if(sec==='Hair'||sec==='Color') return []; // handled specially / hidden during search? show via search below
  if(q) r=r.filter(o=>o.name.toLowerCase().includes(q)||String(o.id).includes(q));
  return r;
}
function renderURL(){
  const ids=[sel.face,sel.hair,...Object.values(sel.items)];
  return `${API}/Character/${sel.skin}/${ids.join(',')}/${sel.anim}/${sel.frame}`;
}
function refreshPreview(){
  const url=renderURL();
  const img=new Image(); img.onload=()=>{ prev.src=url; }; img.src=url;
  $('fno').textContent=sel.frame;
  const names=Object.entries(sel.items).map(([k,v])=>`${k}:${v}`).join(' · ');
  worn.textContent=`${baseName((CAT.find(o=>o.id===sel.hair)||{name:''}).name)} · ${HAIR_COLORS[sel.hair%10]||''} · face ${sel.face}`+(names?' · '+names:'');
  try{ history.replaceState(null,'','#'+btoa(JSON.stringify(sel))); }catch(e){}
}
function pick(slot,id){
  if(slot==='Overall'&&id){ delete sel.items.Top; delete sel.items.Bottom; }
  if((slot==='Top'||slot==='Bottom')&&id){ delete sel.items.Overall; }
  if(id) sel.items[slot]=id; else delete sel.items[slot];
  refreshPreview(); draw();
}
function tile(html,on,fn){
  const d=document.createElement('div'); d.className='tile'+(on?' on':''); d.innerHTML=html; d.onclick=fn; return d;
}
function draw(){
  scroll.innerHTML='';
  const q=$('q').value.trim().toLowerCase();
  if(q){ // search mode: flat results across sex-filtered catalog
    let r=CAT.filter(vis);
    if($('cash').checked) r=r.filter(o=>o.cash);
    r=r.filter(o=>o.name.toLowerCase().includes(q)||String(o.id).includes(q)).slice(0,120);
    const sec=document.createElement('div'); sec.className='sec';
    sec.innerHTML=`<h2>Search · ${r.length}${r.length===120?'+':''}</h2>`;
    const row=document.createElement('div'); row.className='row'; row.style.flexWrap='wrap'; row.style.overflow='visible';
    for(const o of r){
      row.appendChild(tile(`<img loading="lazy" decoding="async" src="${API}/item/${o.id}/icon"><span>${o.name}</span>`,Object.values(sel.items).includes(o.id)||sel.hair===o.id||sel.face===o.id,()=>{
        if(o.sub==='Hair'){ sel.hair=o.id; sel.hairCol=o.id%10; }
        else if(o.sub==='Face'){ sel.face=o.id; }
        else pick(slotOf(o),o.id);
        refreshPreview(); draw();
      }));
    }
    sec.appendChild(row); scroll.appendChild(sec);
    status.textContent='tap to wear · hair/face set directly';
    return;
  }
  for(const s of SECTIONS){
    const sec=document.createElement('div'); sec.className='sec';
    const row=document.createElement('div'); row.className='row';
    if(s.id==='Hair'){
      sec.innerHTML=`<h2><span>${s.label}</span><button class="seeall" data-see="Hair">see all →</button></h2>`;
      for(const h of hairStyles()){
        row.appendChild(tile(`<img loading="lazy" decoding="async" src="${API}/item/${h.icon}/icon"><span>${h.name}</span>`,Math.floor(sel.hair/10)===h.style,()=>{
          const want=h.items.find(x=>x.id%10===sel.hairCol)||h.items[0];
          sel.hair=want.id; refreshPreview(); draw();
        }));
      }
    } else if(s.id==='Color'){
      sec.innerHTML=`<h2>${s.label} · ${HAIR_COLORS[sel.hairCol]}</h2>`;
      HAIR_COLORS.forEach((c,i)=>{
        const d=document.createElement('div'); d.className='tile'+(sel.hairCol===i?' on':'');
        d.innerHTML=`<div class="dot" style="background:${HAIR_DOTS[i]}"></div><span>${c}</span>`;
        d.onclick=()=>{
          const st=Math.floor(sel.hair/10);
          const v=CAT.find(o=>o.sub==='Hair'&&Math.floor(o.id/10)===st&&o.id%10===i&&vis(o));
          if(v) sel.hair=v.id;
          sel.hairCol=i; refreshPreview(); draw();
        };
        row.appendChild(d);
      });
    } else if(s.id==='Face'){
      sec.innerHTML=`<h2><span>${s.label}</span><button class="seeall" data-see="Face">see all →</button></h2>`;
      for(const o of CAT.filter(o=>o.sub==='Face'&&vis(o))){
        row.appendChild(tile(`<img loading="lazy" decoding="async" src="${API}/item/${o.id}/icon"><span>${o.name}</span>`,sel.face===o.id,()=>{ sel.face=o.id; refreshPreview(); draw(); }));
      }
    } else {
      const list=itemsFor(s.id);
      if(!list.length) continue;
      sec.innerHTML=`<h2><span>${s.label} · ${list.length}</span><button class="seeall" data-see="${s.id}">see all →</button></h2>`;
      row.appendChild(tile(`<span style="font-size:18px">✕</span><span>off</span>`,!sel.items[s.id],()=>pick(s.id,null)));
      for(const o of list){
        row.appendChild(tile(`<img loading="lazy" decoding="async" src="${API}/item/${o.id}/icon"><span>${o.name}</span>`,sel.items[s.id]===o.id,()=>pick(s.id,o.id)));
      }
    sec.appendChild(row); scroll.appendChild(sec);
    sec.querySelector('[data-see]')?.addEventListener('click',e=>{ e.stopPropagation(); openCat(s.id); });
  }
  status.textContent=`${CAT.filter(vis).length} items · ${sel.sex==='m'?'♂ male':'♀ female'} · tap to wear`;
}
let catSec=null;
function openCat(sec){
  catSec=sec;
  $('catq').value=''; $('catcash').checked=$('cash').checked;
  $('cattitle').textContent=(SECTIONS.find(s=>s.id===sec)||{label:sec}).label;
  $('catpage').classList.add('open'); $('scroll').classList.add('hidden');
  drawCat();
}
function closeCat(){ catSec=null; $('catpage').classList.remove('open'); $('scroll').classList.remove('hidden'); }
function drawCat(){

      g.appendChild(tile(`<img loading="lazy" decoding="async" src="${API}/item/${o.id}/icon"><span>${o.name}</span>`,sel.face===o.id,()=>{ sel.face=o.id; refreshPreview(); drawCat(); }));
    } else {
      g.appendChild(tile(`<img loading="lazy" decoding="async" src="${API}/item/${o.id}/icon"><span>${o.name}</span>`,sel.items[catSec]===o.id,()=>{pick(catSec,o.id);drawCat();}));
    }
  }
  status.textContent=`${r.length} in ${(SECTIONS.find(s=>s.id===catSec)||{label:catSec}).label}`;
}
function setSex(s){
  sel.sex=s;
  localStorage.setItem('mf-sex',s);
  $('sexbtn').textContent=s==='m'?'♂ ▾':'♀ ▾';
  $('mMale').classList.toggle('on',s==='m'); $('mFemale').classList.toggle('on',s==='f');
  if(s==='m'){ if(sel.hair>=31000){sel.hair=30000+sel.hairCol;} if(sel.face>=21000) sel.face=20000; }
  else { if(sel.hair<31000){sel.hair=31000+sel.hairCol;} if(sel.face<21000) sel.face=21000; }
  $('gate').style.display='none';
  refreshPreview(); draw();
}
async function boot(){
  try{ const sk=await fetch(API+'/Character').then(r=>r.json()); if(Array.isArray(sk)&&sk.length) skins=sk; }catch(e){}
  if(!skins.includes(sel.skin)) sel.skin=skins[0];
  const skEl=$('skins'); skEl.innerHTML='';
  const tones=['#f7d7b5','#e8b98a','#c98d5f','#8a5a33','#5b6b7a','#cfcfcf','#f2e3c6'];
  skins.forEach((s,i)=>{ const b=document.createElement('button');
    b.dataset.s=s; b.title='skin '+s; b.style.background=tones[i%tones.length];
    b.onclick=()=>{sel.skin=s;refreshPreview();skEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.s===s));}; skEl.appendChild(b); });
  skEl.querySelector(`button[data-s="${sel.skin}"]`)?.classList.add('on');
  $('anim').value=sel.anim;
  const saved=sel.sex||localStorage.getItem('mf-sex');
  if(saved==='m'||saved==='f'){ setSex(saved); }
  else { refreshPreview(); draw(); } // gate visible
}
let qT=null, catT=null;
$('q').oninput=()=>{ clearTimeout(qT); qT=setTimeout(draw,120); };
$('cash').onchange=()=>{ draw(); if(catSec) drawCat(); };
$('back').onclick=closeCat;
$('catq').oninput=()=>{ clearTimeout(catT); catT=setTimeout(drawCat,120); };
$('catcash').onchange=drawCat;
$('anim').onchange=e=>{sel.anim=e.target.value;sel.frame=0;refreshPreview();};
$('fprev').onclick=()=>{sel.frame=Math.max(0,sel.frame-1);refreshPreview();};
$('fnext').onclick=()=>{sel.frame=sel.frame+1;refreshPreview();};
$('share').onclick=async()=>{ try{ await navigator.clipboard.writeText(location.href); status.textContent='link copied'; }catch(e){ status.textContent=location.href; } };
$('sexbtn').onclick=()=>{ const m=$('menu'); m.style.display=m.style.display==='block'?'none':'block'; };
$('mMale').onclick=()=>{ $('menu').style.display='none'; setSex('m'); };
$('mFemale').onclick=()=>{ $('menu').style.display='none'; setSex('f'); };
$('gMale').onclick=()=>setSex('m');
$('gFemale').onclick=()=>setSex('f');
boot();
</script>
</body>
</html>
